<!doctype html>
<html>
  <head>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
        font-family: var(--vscode-font-family);
      }

      .container {
        width: min(1000px, 100%);
        margin: 0 auto;
        padding: 32px;
        box-sizing: border-box;
      }

      h1 {
        margin-top: 0;
        font-size: 26px;
      }

      .form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 13px;
        font-weight: 600;
        opacity: 0.8;
      }

      input,
      textarea,
      select {
        width: 100%;
        box-sizing: border-box;

        padding: 10px 12px;

        background: var(--vscode-input-background);
        color: var(--vscode-input-foreground);

        border: 1px solid var(--vscode-input-border);
        border-radius: 5px;

        font-family: inherit;
        font-size: 14px;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      .body-editor {
        min-height: 300px;
        font-family: var(--vscode-editor-font-family);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;

        padding: 8px;

        border: 1px solid var(--vscode-input-border);
        border-radius: 5px;

        background: var(--vscode-input-background);
      }

      .tag {
        padding: 4px 10px;
        border-radius: 20px;

        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);

        cursor: pointer;
      }

      .tag.new {
        opacity: 0.5;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .actions {
        margin-top: 20px;

        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      button {
        padding: 8px 18px;

        border-radius: 5px;
        border: none;

        cursor: pointer;

        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
      }

      button:hover {
        background: var(--vscode-button-hoverBackground);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Edit Bookmark</h1>

      <div class="form">
        <div class="field">
          <label>Label</label>
          <input name="label" value="Bookmark @1785514980825" />
        </div>

        <div class="field">
          <label>Description</label>
          <input name="description" value="Captured source block" />
        </div>

        <div class="row">
          <div class="field">
            <label>Privacy</label>
            <select name="privacy">
              <option selected>workspace</option>
              <option>private</option>
              <option>public</option>
            </select>
          </div>

          <div class="field">
            <label>Type</label>
            <select name="type">
              <option selected>code</option>
              <option>note</option>
              <option>reference</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Tags</label>

          <div class="tags">
            <div class="tag">architecture ×</div>
            <div class="tag">rust ×</div>

            <div class="tag new">+ Add tag</div>
          </div>
        </div>

        <div class="field">
          <label>Body</label>
          <textarea name="body" class="body-editor">
        # @note
        # @context
        </textarea
          >
        </div>

        <div class="field">
          <label>Context</label>

          <textarea> </textarea>
        </div>

        <div class="field">
          <label>Code</label>

          <textarea> </textarea>
        </div>

        <div class="field">
          <label>Repository</label>

          <input />
        </div>

        <div class="field">
          <label>Commit</label>

          <input />
        </div>

        <div class="field">
          <label>Scope</label>

          <input value="source.selection" />
        </div>

        <div class="actions">
          <button>Cancel</button>
          <button class="save">Save Bookmark</button>
        </div>
      </div>
    </div>
    <script>
      const vscode = acquireVsCodeApi();

      document.querySelector('button.save').addEventListener('click', () => {
        vscode.postMessage({
          type: 'saveBookmark',
          bookmark: {
            label: document.querySelector('input[name="label"]').value,
            description: document.querySelector('input[name="description"]').value,
            privacy: document.querySelector('select[name="privacy"]').value,
            type: document.querySelector('select[name="type"]').value,
            body: document.querySelector('textarea[name="body"]').value,
            context: document.querySelector('textarea[name="context"]').value,
            code: document.querySelector('textarea[name="code"]').value,
            repo: document.querySelector('input[name="repo"]').value,
            commit: document.querySelector('input[name="commit"]').value,
            scope: document.querySelector('input[name="scope"]').value,
          },
        });
      });
    </script>
  </body>
</html>
